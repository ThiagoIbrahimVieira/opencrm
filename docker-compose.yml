version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: opencrm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: opencrm_dev
    ports:
      - "5432:5432"
    volumes:
      - opencrm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opencrm_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  opencrm_pgdata:
    driver: local
