services:
  - type: web
    name: opencrm-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEMO_ACCOUNTS
        value: "true"
      - key: CORS_ORIGIN
        value: http://localhost:5173
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PII_ENCRYPTION_KEY_HEX
        sync: false
      - key: PII_HMAC_KEY_HEX
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
